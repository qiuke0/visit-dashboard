<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售拜访数据看板</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--panel-soft:#f1f4f7;--border:#d7dde4;--text:#1e2933;--muted:#647484;--soft:#8b99a8;--green:#12805c;--green-soft:#e5f5ee;--amber:#9a6700;--amber-soft:#fff3d6;--red:#b42318;--red-soft:#fde8e7;--blue:#1b64b0;--blue-soft:#e7f0fb;--gold:#b8860b;--gold-soft:#fff8dc;--silver:#6c757d;--silver-soft:#e9ecef;--bronze:#b87333;--bronze-soft:#fdf0e6;--radius:8px;--shadow:0 10px 28px rgba(31,41,55,.08)}
*{box-sizing:border-box}html{font-size:14px}body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.page{max-width:1600px;margin:0 auto;padding:22px 24px 44px}
.header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px;flex-wrap:wrap;background:linear-gradient(135deg,#1a3a5c 0%,#0d2540 100%);padding:22px 24px;border-radius:8px;box-shadow:0 4px 20px rgba(13,37,64,.25)}
h1{margin:0;font-size:1.55rem;color:#fff}.subtitle{margin-top:6px;color:rgba(255,255,255,.75);font-size:.88rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;color:rgba(255,255,255,.8);font-size:.78rem}
.meta span{display:inline-flex;align-items:center;padding:4px 8px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.tabs{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;width:fit-content}
.tab{padding:10px 22px;border:none;background:none;cursor:pointer;font-weight:700;color:var(--muted);font-size:.92rem;border-right:1px solid var(--border)}
.tab:last-child{border-right:none}.tab.active{background:var(--blue-soft);color:var(--blue)}
.subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.subtab{padding:6px 14px;border:1px solid var(--border);border-radius:999px;background:var(--panel);cursor:pointer;font-size:.82rem;color:var(--muted);font-weight:700}
.subtab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.lb-card,.table-wrap{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.summary{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:14px;margin-bottom:16px}
.metric{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);min-width:0;overflow:hidden;box-shadow:var(--shadow)}
.metric-top{padding:10px 14px 6px;border-top:3px solid var(--blue)}
.metric.c-green .metric-top{border-top-color:var(--green)}.metric.c-amber .metric-top{border-top-color:var(--amber)}.metric.c-red .metric-top{border-top-color:var(--red)}.metric.c-gold .metric-top{border-top-color:var(--gold)}
.metric-label{color:var(--muted);font-size:.74rem;font-weight:700}
.metric-dashed{border-bottom:1px dashed var(--border);margin:0 14px}
.metric-body{padding:8px 14px 12px}
.metric-value{font-size:1.5rem;font-weight:800;white-space:nowrap}
.metric-note{margin-top:3px;color:var(--soft);font-size:.75rem}
.lb-card{margin-bottom:16px;overflow:hidden}
.lb-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel-soft)}
.lb-title{margin:0;font-size:1.05rem;font-weight:800}
.lb-note{color:var(--muted);font-size:.8rem}
.lb-scroll{overflow:auto;max-height:680px;padding:10px 14px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:background .15s}
.lb-row:hover{background:#f4f7fa}
.lb-row.expanded{background:var(--blue-soft)}
.lb-rank{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:.85rem;flex-shrink:0;color:#fff}
.lb-rank.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b)}.lb-rank.r2{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}.lb-rank.r3{background:linear-gradient(135deg,#d4a574,#b87333)}.lb-rank.rn{background:linear-gradient(135deg,#e2e8f0,#cbd5e1);color:#647484}
.lb-name{min-width:70px;font-weight:700;font-size:.9rem;color:var(--text);flex-shrink:0}
.lb-bar-wrap{flex:1;height:22px;background:#edf0f3;border-radius:999px;overflow:hidden;min-width:100px;position:relative}
.lb-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#dbeafe 0%,var(--blue) 100%)}
.lb-bar-fill.old{background:linear-gradient(90deg,#d1f5e5 0%,var(--green) 100%)}
.lb-bar-fill.report{background:linear-gradient(90deg,#fef3c7 0%,#f59e0b 100%)}
.lb-bar-fill.checkin{background:linear-gradient(90deg,#ddd6fe 0%,#6366f1 100%)}
.lb-value{min-width:60px;text-align:right;font-weight:800;font-size:1rem;flex-shrink:0}
.lb-value.new{color:var(--blue)}
.lb-value.old{color:var(--green)}
.lb-value.report{color:#f59e0b}
.lb-value.checkin{color:#6366f1}
.lb-hd{display:flex;align-items:center;gap:12px;padding:6px 8px 10px;font-size:.74rem;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);margin-bottom:6px}
.lb-hd .lb-name{font-size:.74rem}
.lb-hd .lb-value{text-align:right;font-size:.72rem;font-weight:700}
.lb-detail{display:none;padding:14px 16px 16px;background:#f9fafb;border-radius:10px;margin:0 0 8px}
.lb-detail.show{display:block}
.lb-detail-title{font-weight:800;color:var(--text);margin-bottom:10px;font-size:.85rem;text-align:center}
.lb-detail-stats{display:flex;justify-content:center;gap:28px;margin-bottom:12px;padding:8px 0;border-bottom:1px dashed var(--border)}
.lb-detail-stats .stat-item{text-align:center}
.lb-detail-stats .stat-label{color:var(--muted);font-size:.72rem;font-weight:700}
.lb-detail-stats .stat-val{font-size:1.1rem;font-weight:800;color:var(--text);margin-top:2px}
.lb-detail-tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.lb-detail-tbl th{background:var(--panel-soft);font-size:.72rem;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
.lb-detail-tbl td{padding:6px 8px;font-size:.78rem;border-bottom:1px solid var(--border)}
.lb-detail-tbl tr:hover{background:#f0f5fa}
.tag{display:inline-flex;align-items:center;max-width:100%;padding:3px 7px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.tag.green{color:var(--green);background:var(--green-soft)}.tag.blue{color:var(--blue);background:var(--blue-soft)}.tag.amber{color:var(--amber);background:var(--amber-soft)}.tag.gray{color:var(--muted);background:var(--panel-soft)}
.empty{padding:30px;color:var(--muted);text-align:center}
.note-box{border:1px solid var(--blue-soft);background:var(--blue-soft);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:.8rem;color:var(--blue);line-height:1.6}
.note-box b{font-weight:800}
@media(max-width:1100px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.header{align-items:flex-start;flex-direction:column}.meta{justify-content:flex-start}.tabs{width:100%}.tab{flex:1;text-align:center}}
</style>
</head>

<main class="page">
  <header class="header">

  <section class="summary" id="summary"></section>
  <section id="boardArea"></section>
</main>

<script>
const D=JSON.parse(document.getElementById('rawData').textContent);
const META=D.meta||{};
const TODAY=META.today||'';
const WK_R=D.week_range||['',''];
const MO_R=D.month_range||['',''];
let curPeriod='week';
let curType='new';

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function init(){
  document.getElementById('meta').innerHTML=[
    '截至：'+TODAY,
    curPeriod==='week'?('本周：'+WK_R[0]+' ~ '+WK_R[1]):('本月：'+MO_R[0]+' ~ '+MO_R[1]),
    '销售人数：'+D.all_sales.length
  ].map(t=>'<span>'+esc(t)+'</span>').join('');
  document.getElementById('noteBox').innerHTML='<b>规则说明：</b>新签客户(N)按拜访方式计积分 — 电话拜访1分 / 上门拜访5分 / 会议营销5分(归入上门)；老客(Y)只统计拜访数量不计积分。<b>点击任意行可下钻查看明细</b>。';
  // tabs
  document.querySelectorAll('#periodTabs .tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('#periodTabs .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');curPeriod=t.dataset.period;render();
  }));
  document.querySelectorAll('#typeSubtabs .subtab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('#typeSubtabs .subtab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');curType=t.dataset.type;render();
  }));
  render();
}

function curData(){
  if(curType==='report'){
    return D['report_'+curPeriod]||[];
  }
  if(curType==='checkin'){
    return D['checkin_'+curPeriod]||[];
  }
  let key=curType+'_'+curPeriod;
  return D[key]||[];
}

function renderSummary(rows){
  // 上门签到打卡模式
  if(curType==='checkin'){
    let total=rows.reduce((s,r)=>s+r['签到数'],0);
    let cards=[];
    let groups=D.sales_groups||{};
    Object.keys(groups).forEach(function(gname){
      let members=groups[gname]||[];
      let gRows=rows.filter(function(r){return members.includes(r['销售'])});
      let gTotal=gRows.reduce(function(s,r){return s+r['签到数']},0);
      cards.push([gname,gTotal,'','c-blue']);
    });
    cards.push(['签到总数',total,'','c-gold']);
    document.getElementById('summary').innerHTML=cards.map(function(c){return '<div class="metric '+c[3]+'"><div class="metric-top"><div class="metric-label" style="font-weight:800">'+esc(c[0])+'</div></div><div class="metric-dashed"></div><div class="metric-body"><div class="metric-value">'+esc(c[1])+'</div><div class="metric-note">'+esc(c[2]||' ')+'</div></div></div>'}).join('');
    return;
  }
  // 商机报备模式
  if(curType==='report'){
    let total=rows.reduce((s,r)=>s+r['报备数'],0);
    let cards=[];
    // 团队分组统计
    let groups=D.sales_groups||{};
    Object.keys(groups).forEach(function(gname){
      let members=groups[gname]||[];
      let gRows=rows.filter(function(r){return members.includes(r['销售'])});
      let gTotal=gRows.reduce(function(s,r){return s+r['报备数']},0);
      cards.push([gname,gTotal,'','c-amber']);
    });
    cards.push(['报备总数',total,'','c-gold']);
    document.getElementById('summary').innerHTML=cards.map(function(c){return '<div class="metric '+c[3]+'"><div class="metric-top"><div class="metric-label" style="font-weight:800">'+esc(c[0])+'</div></div><div class="metric-dashed"></div><div class="metric-body"><div class="metric-value">'+esc(c[1])+'</div><div class="metric-note">'+esc(c[2]||' ')+'</div></div></div>'}).join('');
    return;
  }
  let tel=rows.reduce((s,r)=>s+r['电话拜访'],0);
  let visit=rows.reduce((s,r)=>s+r['上门拜访'],0);
  let meeting=rows.reduce((s,r)=>s+r['会议营销'],0);
  let total=rows.reduce((s,r)=>s+r['总拜访'],0);
  let score=rows.reduce((s,r)=>s+(r['积分']||0),0);
  // 4个销售团队拜访量
  let groups=D.sales_groups||{};
  let groupCards=Object.keys(groups).map(function(gname){
    let members=groups[gname]||[];
    let gRows=rows.filter(function(r){return members.includes(r['销售'])});
    let gTotal=gRows.reduce(function(s,r){return s+r['总拜访']},0);
    let gTel=gRows.reduce(function(s,r){return s+r['电话拜访']},0);
    let gVisit=gRows.reduce(function(s,r){return s+r['上门含会议']},0);
    return [gname,gTotal,'电话'+gTel+' / 上门'+gVisit,'c-blue'];
  });
  let cards;
  if(curType==='new'){
    cards=groupCards.concat([['总拜访量',total,'电话'+tel+' / 上门'+(visit+meeting),'c-green']]);
  }else{
    cards=groupCards.concat([['总拜访量',total,'','c-green']]);
  }
  document.getElementById('summary').innerHTML=cards.map(function(c){return '<div class="metric '+c[3]+'"><div class="metric-top"><div class="metric-label" style="font-weight:800">'+esc(c[0])+'</div></div><div class="metric-dashed"></div><div class="metric-body"><div class="metric-value">'+esc(c[1])+'</div><div class="metric-note">'+esc(c[2]||' ')+'</div></div></div>'}).join('');
}

function renderBoard(rows){
  let area=document.getElementById('boardArea');
  if(!rows.length){area.innerHTML='<div class="empty">该时段暂无数据</div>';return}
  let isNew=curType==='new';
  let isReport=curType==='report';
  let isCheckin=curType==='checkin';
  let valKey=isReport?'报备数':(isCheckin?'签到数':(isNew?'积分':'总拜访'));
  let maxVal=Math.max(1,...rows.map(r=>r[valKey]));
  let title=isReport?'商机报备数量排行':(isCheckin?'上门签到打卡排行':(isNew?'新签客户积分排行':'老客拜访量统计'));
  let periodLabel=curPeriod==='week'?('本周 '+WK_R[0]+' ~ '+WK_R[1]):('本月 '+MO_R[0]+' ~ '+MO_R[1]);
  let valLabel=isReport?'报备数':(isCheckin?'签到数':(isNew?'积分':'总拜访'));
  let html='<div class="lb-card"><div class="lb-head"><h2 class="lb-title">'+esc(title)+'</h2><div class="lb-note">'+esc(periodLabel)+'</div></div>';
  html+='<div class="lb-scroll">';
  rows.forEach((r,i)=>{
    let rank=i+1;
    let rk=rank<=3?'r'+rank:'rn';
    let val=r[valKey];
    let pct=(val/maxVal*100).toFixed(1);
    let barCls=isReport?'report':(isCheckin?'checkin':(isNew?'':'old'));
    let valCls=isReport?'report':(isCheckin?'checkin':(isNew?'new':'old'));
    // 报备模式: 不可点击下钻; 签到模式: 可下钻
    if(isReport){
      html+='<div class="lb-row" style="cursor:default">';
    }else{
      html+='<div class="lb-row" data-idx="'+i+'">';
    }
    html+='<div class="lb-rank '+rk+'">'+rank+'</div>';
    html+='<div class="lb-name">'+esc(r['销售'])+'</div>';
    html+='<div class="lb-bar-wrap"><div class="lb-bar-fill '+barCls+'" style="width:'+pct+'%"></div></div>';
    html+='<div class="lb-value '+valCls+'">'+val+'</div>';
    html+='</div>';
    if(!isReport){
      // detail (new/old/checkin, not report)
      let recs=r['records']||[];
      html+='<div class="lb-detail" id="detail-'+i+'"><div class="lb-detail-title">'+esc(r['销售'])+' 明细 ('+recs.length+'条)</div>';
      if(isCheckin){
        // 签到下钻: 日期/时间/地点/详细地址/备注
        html+='<div class="lb-detail-stats"><div class="stat-item"><div class="stat-label">签到次数</div><div class="stat-val" style="color:#6366f1">'+r['签到数']+'</div></div></div>';
        if(recs.length){
          html+='<table class="lb-detail-tbl"><thead><tr><th class="sortable-th" onclick="toggleDetailSort('+i+')" style="cursor:pointer">日期 <span id="sortIcon-'+i+'">↓</span></th><th>时间</th><th>地点</th><th>详细地址</th><th>备注</th></tr></thead><tbody>';
          recs.forEach(rec=>{
            html+='<tr><td>'+esc(rec['日期']||'-')+'</td><td>'+esc(rec['时间']||'-')+'</td><td>'+esc(rec['地点']||'-')+'</td><td>'+esc(rec['详细地址']||'-')+'</td><td>'+esc(rec['备注']||'-')+'</td></tr>';
          });
          html+='</tbody></table>';
        }else{html+='<div class="empty">无明细</div>'}
      }else{
        // 拜访下钻
        html+='<div class="lb-detail-stats"><div class="stat-item"><div class="stat-label">电话拜访</div><div class="stat-val">'+r['电话拜访']+'</div></div><div class="stat-item"><div class="stat-label">上门(含会议)</div><div class="stat-val">'+r['上门含会议']+'</div></div><div class="stat-item"><div class="stat-label">总拜访</div><div class="stat-val">'+r['总拜访']+'</div></div>'+(isNew?'<div class="stat-item"><div class="stat-label">积分</div><div class="stat-val" style="color:var(--blue)">'+r['积分']+'</div></div>':'')+'</div>';
        if(recs.length){
          html+='<table class="lb-detail-tbl"><thead><tr><th class="sortable-th" onclick="toggleDetailSort('+i+')" style="cursor:pointer">日期 <span id="sortIcon-'+i+'">↓</span></th><th>客户ID</th><th>联系人</th><th>拜访方式</th><th>客户类型</th><th>记录详情</th></tr></thead><tbody>';
          recs.forEach(rec=>{
            let mc=rec['拜访方式']==='电话拜访'?'blue':(rec['拜访方式']==='上门拜访'||rec['拜访方式']==='会议营销')?'green':'gray';
            html+='<tr><td>'+esc(rec['日期']||'-')+'</td><td>'+esc(rec['客户id']||'-')+'</td><td>'+esc(rec['联系人姓名']||'-')+'</td><td><span class="tag '+mc+'">'+esc(rec['拜访方式']||'-')+'</span></td><td><span class="tag '+(rec['客户类型']==='老客'?'amber':'blue')+'">'+esc(rec['客户类型'])+'</span></td><td>'+esc(rec['拜访记录详情']||'-')+'</td></tr>';
          });
          html+='</tbody></table>';
        }else{html+='<div class="empty">无明细</div>'}
      }
      html+='</div>';
    }
  });
  html+='</div></div>';
  area.innerHTML=html;
  // detail sort state
  window._detailSortDir={};
  window._detailSortIdx={};
  // bind row click to drill down (skip report)
  if(!isReport){
    area.querySelectorAll('.lb-row[data-idx]').forEach(row=>{
      row.addEventListener('click',()=>{
        let idx=row.dataset.idx;
        let detail=document.getElementById('detail-'+idx);
        let open=detail.classList.toggle('show');
        row.classList.toggle('expanded',open);
      });
    });
  }
}

function toggleDetailSort(idx){
  var dir=window._detailSortDir[idx]||'desc';
  dir=dir==='desc'?'asc':'desc';
  window._detailSortDir[idx]=dir;
  var icon=document.getElementById('sortIcon-'+idx);
  if(icon)icon.textContent=dir==='asc'?'↑':'↓';
  var detail=document.getElementById('detail-'+idx);
  if(!detail)return;
  var tbody=detail.querySelector('tbody');
  if(!tbody)return;
  var rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort(function(a,b){
    var va=a.querySelector('td')?a.querySelector('td').textContent:'';
    var vb=b.querySelector('td')?b.querySelector('td').textContent:'';
    if(dir==='asc')return va.localeCompare(vb);
    return vb.localeCompare(va);
  });
  rows.forEach(function(r){tbody.appendChild(r)});
}

function render(){
  // update meta
  document.getElementById('meta').innerHTML=[
    '截至：'+TODAY,
    curPeriod==='week'?('本周：'+WK_R[0]+' ~ '+WK_R[1]):('本月：'+MO_R[0]+' ~ '+MO_R[1]),
    '销售人数：'+D.all_sales.length
  ].map(t=>'<span>'+esc(t)+'</span>').join('');
  let rows=curData();
  renderSummary(rows);
  renderBoard(rows);
}

init();
</script>
</body>
</html>
